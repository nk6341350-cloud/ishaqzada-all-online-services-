<!doctype html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#004b35">
<title>Ishaqzada Online Services</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">I</div>
    <div><b>اسحاقزاده آنلاین خدمات</b><small>Ishaqzada Online Services</small></div>
  </div>
  <button class="install" id="installBtn">⬇ نصب</button>
</header>

<main>
<section class="hero">
  <div class="heroBadge">ISHAQZADA</div>
  <h1>اسحاقزاده آنلاین خدمات</h1>
  <p>ستاسو د ورځنیو اړتیاوو لپاره چټک او اسانه آنلاین خدمات</p>
  <div class="goldline"></div>
</section>

<section class="intro">
  <span>زموږ خدمات</span>
  <h2>خپل مطلوب خدمت انتخاب کړئ</h2>
</section>

<section class="services">
  <button class="service" data-service="ride">
    <div class="visual taxi"><span>🚕</span></div><div class="txt"><b>سواري</b><small>ښاري او اطرافي سفرونه</small></div><i>←</i>
  </button>
  <button class="service" data-service="cargo">
    <div class="visual truck"><span>🚚</span></div><div class="txt"><b>باربري</b><small>د بار انتقال خدمتونه</small></div><i>←</i>
  </button>
  <button class="service" data-service="worker">
    <div class="visual worker"><span>🧰</span></div><div class="txt"><b>کاریګر</b><small>مسلکي کاریګر پیدا کړئ</small></div><i>←</i>
  </button>
  <button class="service" data-service="store">
    <div class="visual store"><span>🛍️</span></div><div class="txt"><b>آنلاین سټور</b><small>آنلاین جنسونه او محصولات</small></div><i>←</i>
  </button>
  <button class="service" data-service="cars">
    <div class="visual car"><span>🚗</span></div><div class="txt"><b>موټرپلورنځی</b><small>موټرونه وګورئ او پیدا یې کړئ</small></div><i>←</i>
  </button>
  <button class="service" data-service="property">
    <div class="visual home"><span>🏠</span></div><div class="txt"><b>رهنمایي معاملات</b><small>کور، دوکان او ځمکه پیدا کړئ</small></div><i>←</i>
  </button>
</section>

<section class="notice">
  <div class="shield">✓</div>
  <div><b>باوري او اسانه خدمات</b><small>هر خدمت به وروسته د خپل اصلي سیستم سره وصل شي.</small></div>
</section>
</main>

<nav class="bottom">
 <button class="active">⌂<span>کور</span></button>
 <button>⌕<span>لټون</span></button>
 <button>☻<span>زما حساب</span></button>
</nav>
<script src="app.js"></script>
</body></html>
